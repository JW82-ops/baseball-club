<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10261c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>프로야구팀을 만들자</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css?v=71" />
</head>
<body>
  <div id="app">
    <div id="scene" aria-hidden="true"><i></i><i></i></div>
    <div id="seasonfx" aria-hidden="true"></div>
    <header id="hud" hidden></header>
    <main id="main"></main>
    <nav id="tabs" hidden>
      <button data-act="tab" data-tab="roster"><img class="tabico" src="img/ui/roster.webp" alt="" width="34" height="34"><span>선수단</span></button>
      <button data-act="tab" data-tab="develop"><img class="tabico" src="img/ui/develop.webp" alt="" width="34" height="34"><span>육성</span></button>
      <button class="tab-play" data-act="centerTab" data-tab="home"><i class="ball"><img class="tabico" src="img/ui/play.webp" alt="" width="44" height="44"><span>경기</span></i></button>
      <button data-act="tab" data-tab="club"><img class="tabico" src="img/ui/club.webp" alt="" width="34" height="34"><span>구단</span></button>
      <button data-act="tab" data-tab="league"><img class="tabico" src="img/ui/league.webp" alt="" width="34" height="34"><span>리그</span></button>
    </nav>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal" hidden>
      <div class="modal-bg" data-act="closeModal"></div>
      <div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div>
    </div>
  </div>
  <script type="module" src="js/main.js?v=71"></script>
</body>
</html>
