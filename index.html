<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10261c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>프로야구팀을 만들자</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hud" hidden></header>
    <main id="main"></main>
    <nav id="tabs" hidden>
      <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>홈</span></button>
      <button data-act="tab" data-tab="roster"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6M14.5 15c.8-.4 1.6-.6 2.5-.6 2.6 0 4 1.9 4 5"/></svg><span>선수단</span></button>
      <button data-act="tab" data-tab="develop"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/><path d="M15 7h3v3"/></svg><span>육성</span></button>
      <button data-act="tab" data-tab="league"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 01-10 0zM7 6H4c0 3 1.5 4.5 3.5 4.5M17 6h3c0 3-1.5 4.5-3.5 4.5M10 14h4v3h-4zM8 20h8"/></svg><span>리그</span></button>
      <button data-act="tab" data-tab="club"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6M4 20h16"/></svg><span>구단</span></button>
    </nav>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal" hidden>
      <div class="modal-bg" data-act="closeModal"></div>
      <div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
